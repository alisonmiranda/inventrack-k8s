apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: inventrack-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: inventrack
    environment: production
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
