apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: inventrack-prod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: inventrack
    environment: production
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
