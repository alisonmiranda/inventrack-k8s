apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: inventrack-prod
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: inventrack
    environment: production
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
