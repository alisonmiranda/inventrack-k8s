apiVersion: v1
kind: Secret
metadata:
  name: inventrack-secrets
  namespace: inventrack-prod
  labels:
    app.kubernetes.io/name: inventrack
    app.kubernetes.io/part-of: inventrack
    environment: production
type: Opaque
data:
  # Replace these placeholders with real base64-encoded values before deploying.
  JWT_SECRET: "<BASE64_JWT_SECRET>"
  DB_USER: "<BASE64_DB_USER>"
  DB_PASSWORD: "<BASE64_DB_PASSWORD>"
  GROQ_API_KEY: "<BASE64_GROQ_API_KEY>"
